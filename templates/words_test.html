{% extends 'base.html' %}

{% block head_extra %}
<script src="{{ url_for('static', filename='poem_builder.js') }}" defer></script>
{% endblock %}

{% block content %}
<h1>Words Test</h1>
<div id="poem-container" class="poem-container"></div>
<div id="word-counter">0/10 words</div>
<div id="poem-selector" class="poem-selector">
    {% for word in words %}
    <span class="word" onclick="addWord('{{word}}')">{{ word }}</span>
    {% endfor %}
</div>
<br>

{% endblock %}
